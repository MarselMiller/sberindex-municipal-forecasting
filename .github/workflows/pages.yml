name: GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy only after publication review and Pages approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install publication dependencies
        run: python -m pip install -r requirements-publication.txt
      - name: Verify generated sources without model fits
        run: |
          python scripts/build_final_summary.py --editorial-only --check
          python scripts/build_project_report.py --check
      - name: Build and verify Pages package
        run: |
          python scripts/build_publication_site.py --require-tracked-inputs
          python scripts/build_publication_site.py --require-tracked-inputs --check
          python -m pytest -q tests/test_publication_site.py tests/test_public_editorial.py tests/test_public_repository_audit.py tests/test_final_summary.py
          git diff --check
      - name: Block publication on repository or history findings
        run: python scripts/audit_public_repository.py --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/submission-site
          retention-days: 1
  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
