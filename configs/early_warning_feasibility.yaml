# E07a specification fixed before counting real weak events; no classifier fitting.
experiment: early_warning_feasibility_v1
experiment_date: '2026-10-07'
seed: 42
data:
  path: data/input/consumption_all_categories.csv
  category: Все категории
  first_month: '2023-01'
  last_month: '2024-12'
  release_lag_months: 0
  availability_assumption: E01_month_end_midnight_Moscow_L0_no_verified_expense_vintages
reference:
  e01_dir: outputs/prophet_comparison_v1
  e04_dir: outputs/online_detection_v1
  e06a_dir: outputs/offline_detection_v1
  e06b_dir: outputs/news_events_v2
  e05c_dir: outputs/macro_forecast_v1
  macro_audit_dir: outputs/macro_data_audit_v1
  first_origin: '2023-12'
  last_origin: '2024-11'
weak_label:
  target: sustained_shift_in_SeasonalNaiveYoY_h1_forecast_error_not_spending_level
  error: y_true_minus_saved_causal_y_pred
  seasonality: saved_SeasonalNaiveYoY_h1_same_month_previous_year_prediction
  past_window_months: 4
  confirmation_months: 3
  center: median_four_immediately_preceding_calendar_residuals
  scale: max_1.4826_MAD_0.03_median_absolute_past_prediction_1_ruble
  relative_scale_floor: 0.03
  absolute_scale_floor: 1.0
  strength_threshold: 3.0
  criterion: all_three_future_residuals_same_signed_deviation_at_least_threshold_times_scale
  missing: require_all_four_past_and_three_confirmation_months_finite_no_fill
  merge_gap_months: 2
  merge: adjacent_same_direction_candidates_and_same_direction_unrecovered_regime_are_continuations
  recovery_months: 2
  recovery_strength: 1.5
  recovery: two_consecutive_residuals_below_signed_recovery_threshold_using_episode_frozen_baseline
  active_risk_exclusion: confirmed_active_regime_known_on_origin_only
  retrospective_inside_regime: diagnostic_only_never_feature_or_causal_risk_filter
early_warning:
  horizons_months: [1, 3]
  target_window: '(O, O+k] onset_months_not_confirmation_or_news_dates'
  label_known_at: uniform_complete_future_window_end_O_plus_k_plus_2_months
  positive: at_least_one_new_weak_event_onset_in_target_window
  negative: full_target_and_confirmation_window_observed_no_onset
  right_censoring: unknown_not_zero
  split:
    train_information_cutoff: '2024-07'
    test_first_origin: '2024-08'
    test_last_origin: '2024-11'
    method: fixed_past_training_labels_confirmed_by_cutoff_later_origins_evaluable_only
    status: already_inspected_history_not_new_blind_test
  future_baselines: [constant_training_risk, simple_history_model, same_history_model_plus_admitted_news]
  classifier_fit: false
news:
  old_corpus: data/external/news_raw/corpus.json
  old_catalog: data/external/news_raw/collection_catalog.json
  raw_dir: data/external/news_raw/e07a_key_rate_v1
  audit_output_dir: outputs/early_warning_news_audit_v1
  new_output_dir: outputs/news_events_v3
  archive_trust: explicit_official_dated_original_key_rate_decision_core_only_no_independent_old_SHA
  strict_retrieval_only_variant: retain_v2_as_comparator
  decision_event_id: cbr_key_rate_decision_YYYY_MM_DD_across_release_PDF_translation_snapshots
  source_class: CBR_key_rate_decision_press_releases_2023_2024_including_unchanged
  max_new_requests: 100
  max_concurrent_requests: 1
  max_retries_per_url: 1
  stop_after_consecutive_blocks: 2
  timeout_seconds: 20
  max_file_bytes: 2097152
  max_bytes: 20971520
  download_by_default: false
  official_pages:
    - https://www.cbr.ru/dkp/mp_dec/decision_key_rate/
    - https://www.cbr.ru/dkp/cal_mp/
feature_audit:
  news_columns: all_26_values_and_26_flags_for_diagnostics_only
  selection_policy: future_column_selection_from_training_only_no_selection_from_full_history
  online_states: prefix_only_existing_E04_selected_parameters_no_refit_forecasting_models
  offline_breakpoints: diagnostic_only_not_features_or_truth
manual_review:
  selection: deterministic_earliest_latest_candidate_and_finite_controls_plus_missing_case
  annotation_status: pending_human_review_AI_audit_not_independent_labels
output_dir: outputs/early_warning_feasibility_v1
smoke_output_dir: outputs/early_warning_feasibility_smoke_v1
report_path: reports/results/E07a_early_warning_feasibility.md
