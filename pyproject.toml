[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "sberindex-forecast-mvp"
version = "0.1.0"
description = "Муниципальные расходы: воспроизводимое прогнозирование и сигналы изменений"
requires-python = ">=3.11"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
